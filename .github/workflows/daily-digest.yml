name: Daily Technology and AI News Digest

on:
  schedule:
    # 03:00 UTC = 08:00 Pakistan Standard Time (UTC+5)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-technology-digest
  cancel-in-progress: false

jobs:
  collect-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      TIME_ZONE: Asia/Karachi
      EMAIL_ENABLED: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
      DIGEST_TO_EMAIL: aalyanofficial40@gmail.com
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect news and email the digest
        run: python run_github_actions.py
